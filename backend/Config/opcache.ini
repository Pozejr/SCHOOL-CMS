; ============================================================
; School CMS — OPcache Configuration
; ============================================================
; Install: add to php.ini or include via php.ini.d/opcache.ini
;
; On Windows with XAMPP, place this file in:
;   C:\xampp\php\extras\opcache.ini
; Then add to php.ini:
;   zend_extension=php_opcache.dll
;
; On Linux, place in:
;   /etc/php/8.4/cli/conf.d/99-school-cms.ini
;   /etc/php/8.4/apache2/conf.d/99-school-cms.ini
;   /etc/php/8.4/fpm/conf.d/99-school-cms.ini
; ============================================================

[opcache]
; Enable OPcache
opcache.enable=1
opcache.enable_cli=1

; Memory for cached scripts (school-cms ~60 PHP files, 8MB is generous)
opcache.memory_consumption=64

; Interned strings buffer
opcache.interned_strings_buffer=8

; Max cached scripts — school-cms has ~60 files, 256 is plenty with room to grow
opcache.max_accelerated_files=256

; How often to check for file changes (seconds)
; 0 = never (production), 2 = development (fast detection)
opcache.revalidate_freq=2

; Validate timestamps on every request (set 0 in production)
opcache.validate_timestamps=1

; Save comments in compiled bytecode (required for Doctrine annotations, etc.)
opcache.save_comments=1

; Fast shutdown sequence
opcache.fast_shutdown=1

; Optimize compiled code
opcache.optimization_level=0x7FFEBFFF
